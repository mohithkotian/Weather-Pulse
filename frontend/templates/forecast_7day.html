<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Weather Forecast</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .forecast-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .forecast-header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .forecast-header h1 {
            font-size: 32px;
            color: #2d3748;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 600;
            color: #4a5568;
        }

        .control-group input {
            padding: 10px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            width: 120px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f7fafc;
            color: #2d3748;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: #edf2f7;
        }

        .btn-secondary.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .unit-toggle {
            display: flex;
            gap: 0;
            background: #f7fafc;
            border-radius: 10px;
            overflow: hidden;
        }

        .unit-toggle .btn {
            border-radius: 0;
            padding: 10px 25px;
        }

        .forecast-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            perspective: 1000px;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .card-inner {
            position: relative;
            width: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .forecast-card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotateY(180deg);
        }

        .day-name {
            font-size: 18px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .date-label {
            font-size: 13px;
            color: #718096;
            margin-bottom: 15px;
        }

        .weather-icon-container {
            text-align: center;
            margin: 15px 0;
            position: relative;
        }

        .weather-icon {
            width: 80px;
            height: 80px;
        }

        .thunder-indicator {
            position: absolute;
            top: -5px;
            right: 20px;
            width: 24px;
            height: 24px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .temp-container {
            text-align: center;
            margin: 15px 0;
        }

        .temp-max {
            font-size: 32px;
            font-weight: 700;
            color: #e53e3e;
        }

        .temp-min {
            font-size: 20px;
            color: #3182ce;
            margin-left: 5px;
        }

        .description {
            text-align: center;
            font-size: 14px;
            color: #4a5568;
            margin: 10px 0;
            text-transform: capitalize;
        }

        .rain-prob {
            text-align: center;
            font-size: 13px;
            color: #718096;
            background: #edf2f7;
            padding: 5px 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .card-back-content {
            padding: 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 13px;
            color: #718096;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
        }

        .flip-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #667eea;
        }

        .loading-skeleton {
            display: flex;
            gap: 20px;
            overflow-x: auto;
        }

        .skeleton-card {
            min-width: 160px;
            height: 300px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
        }

        .auto-refresh-status {
            font-size: 13px;
            color: #718096;
            margin-left: auto;
        }

        @media (max-width: 768px) {
            .forecast-cards {
                grid-template-columns: 1fr;
                overflow-x: auto;
                display: flex;
            }

            .forecast-card {
                min-width: 160px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-group {
                width: 100%;
            }

            .control-group input {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="forecast-container">
        <div class="forecast-header">
            <h1>7-Day Weather Forecast</h1>
            
            <div class="controls">
                <div class="control-group">
                    <label>Latitude:</label>
                    <input type="number" id="latInput" value="20" step="0.01" />
                </div>
                
                <div class="control-group">
                    <label>Longitude:</label>
                    <input type="number" id="lonInput" value="77" step="0.01" />
                </div>
                
                <div class="unit-toggle">
                    <button class="btn btn-secondary active" data-unit="metric">°C</button>
                    <button class="btn btn-secondary" data-unit="imperial">°F</button>
                </div>
                
                <button class="btn btn-primary" id="refreshBtn">🔄 Refresh</button>
                
                <button class="btn btn-secondary" id="historyToggle">📊 Show History</button>
                
                <div class="control-group">
                    <label>Auto-refresh:</label>
                    <select id="autoRefreshSelect" class="btn btn-secondary">
                        <option value="0">Off</option>
                        <option value="30000">30s</option>
                        <option value="300000">5m</option>
                        <option value="900000" selected>15m</option>
                    </select>
                </div>
                
                <span class="auto-refresh-status" id="refreshStatus"></span>
            </div>
        </div>

        <div id="forecastContent">
            <!-- Forecast cards will be injected here -->
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = '/api/forecast';
        const LIGHTNING_ICON = '/images/icon-for-lighting-and-thunder.png';
        
        // State
        let currentUnits = 'metric';
        let currentLat = 20;
        let currentLon = 77;
        let showingHistory = false;
        let autoRefreshInterval = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            setupEventListeners();
            loadForecast();
        });
        
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('forecastPrefs');
            if (saved) {
                const prefs = JSON.parse(saved);
                currentLat = prefs.lat || 20;
                currentLon = prefs.lon || 77;
                currentUnits = prefs.units || 'metric';
                
                document.getElementById('latInput').value = currentLat;
                document.getElementById('lonInput').value = currentLon;
                
                document.querySelectorAll('.unit-toggle .btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.unit === currentUnits);
                });
            }
        }
        
        function saveToLocalStorage() {
            localStorage.setItem('forecastPrefs', JSON.stringify({
                lat: currentLat,
                lon: currentLon,
                units: currentUnits
            }));
        }
        
        function setupEventListeners() {
            // Unit toggle
            document.querySelectorAll('.unit-toggle .btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.unit-toggle .btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentUnits = btn.dataset.unit;
                    saveToLocalStorage();
                    loadForecast();
                });
            });
            
            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', () => {
                currentLat = parseFloat(document.getElementById('latInput').value);
                currentLon = parseFloat(document.getElementById('lonInput').value);
                saveToLocalStorage();
                loadForecast();
            });
            
            // History toggle
            document.getElementById('historyToggle').addEventListener('click', () => {
                showingHistory = !showingHistory;
                const btn = document.getElementById('historyToggle');
                btn.textContent = showingHistory ? '📅 Show Forecast' : '📊 Show History';
                btn.classList.toggle('active', showingHistory);
                loadForecast();
            });
            
            // Auto-refresh
            document.getElementById('autoRefreshSelect').addEventListener('change', (e) => {
                setupAutoRefresh(parseInt(e.target.value));
            });
            
            // Setup initial auto-refresh
            const initialInterval = parseInt(document.getElementById('autoRefreshSelect').value);
            if (initialInterval > 0) {
                setupAutoRefresh(initialInterval);
            }
        }
        
        function setupAutoRefresh(interval) {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
            
            if (interval > 0) {
                autoRefreshInterval = setInterval(() => {
                    loadForecast();
                }, interval);
                updateRefreshStatus(interval);
            } else {
                document.getElementById('refreshStatus').textContent = '';
            }
        }
        
        function updateRefreshStatus(interval) {
            const minutes = Math.floor(interval / 60000);
            const seconds = Math.floor((interval % 60000) / 1000);
            let text = 'Auto-refresh: ';
            if (minutes > 0) text += `${minutes}m`;
            else text += `${seconds}s`;
            document.getElementById('refreshStatus').textContent = text;
        }
        
        async function loadForecast() {
            const content = document.getElementById('forecastContent');
            content.innerHTML = '<div class="loading-skeleton">' + 
                Array(7).fill('<div class="skeleton-card"></div>').join('') + 
                '</div>';
            
            try {
                const params = new URLSearchParams({
                    lat: currentLat,
                    lon: currentLon,
                    units: currentUnits,
                    history: showingHistory
                });
                
                const response = await fetch(`${API_BASE}?${params}`);
                const data = await response.json();
                
                if (data.status === 'error') {
                    throw new Error(data.message);
                }
                
                renderForecast(data);
                
            } catch (error) {
                content.innerHTML = `
                    <div class="error-message">
                        <h3>❌ Error Loading Forecast</h3>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="loadForecast()">Try Again</button>
                    </div>
                `;
            }
        }
        
        function renderForecast(data) {
            const items = data.forecast || data.historical || [];
            const content = document.getElementById('forecastContent');
            
            if (items.length === 0) {
                content.innerHTML = '<div class="error-message">No forecast data available</div>';
                return;
            }
            
            const cardsHTML = items.map((day, index) => createForecastCard(day, index)).join('');
            content.innerHTML = `<div class="forecast-cards">${cardsHTML}</div>`;
            
            // Add flip functionality
            document.querySelectorAll('.forecast-card').forEach(card => {
                card.addEventListener('click', () => {
                    card.classList.toggle('flipped');
                });
                
                // Keyboard accessibility
                card.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        card.classList.toggle('flipped');
                    }
                });
            });
        }
        
        function createForecastCard(day, index) {
            const tempSymbol = currentUnits === 'metric' ? '°C' : '°F';
            const windSymbol = currentUnits === 'metric' ? 'm/s' : 'mph';
            const iconUrl = `https://openweathermap.org/img/wn/${day.icon}@2x.png`;
            
            const thunderIcon = day.has_thunder ? 
                `<img src="${LIGHTNING_ICON}" class="thunder-indicator" alt="Thunder" />` : '';
            
            return `
                <div class="forecast-card" tabindex="0" role="button" aria-label="Flip card for ${day.day_name}">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="flip-indicator">⟲</div>
                            <div class="day-name">${day.day_name}</div>
                            <div class="date-label">${day.date_formatted}</div>
                            
                            <div class="weather-icon-container">
                                <img src="${iconUrl}" alt="${day.description}" class="weather-icon" />
                                ${thunderIcon}
                            </div>
                            
                            <div class="temp-container">
                                <span class="temp-max">${day.temp_max || day.temp}${tempSymbol}</span>
                                ${day.temp_min !== undefined ? `<span class="temp-min">${day.temp_min}${tempSymbol}</span>` : ''}
                            </div>
                            
                            <div class="description">${day.description}</div>
                            
                            ${day.pop !== undefined ? `<div class="rain-prob">💧 Rain: ${day.pop}%</div>` : ''}
                        </div>
                        
                        <div class="card-back">
                            <div class="flip-indicator">⟲</div>
                            <div class="day-name">${day.day_name}</div>
                            <div class="date-label">${day.date_formatted}</div>
                            
                            <div class="card-back-content">
                                ${day.feels_like !== undefined ? `
                                <div class="detail-row">
                                    <span class="detail-label">Feels like</span>
                                    <span class="detail-value">${day.feels_like}${tempSymbol}</span>
                                </div>` : ''}
                                
                                ${day.humidity !== undefined ? `
                                <div class="detail-row">
                                    <span class="detail-label">💧 Humidity</span>
                                    <span class="detail-value">${day.humidity}%</span>
                                </div>` : ''}
                                
                                ${day.wind_speed !== undefined ? `
                                <div class="detail-row">
                                    <span class="detail-label">💨 Wind</span>
                                    <span class="detail-value">${day.wind_speed} ${windSymbol} ${day.wind_direction || ''}</span>
                                </div>` : ''}
                                
                                ${day.sunrise !== undefined ? `
                                <div class="detail-row">
                                    <span class="detail-label">🌅 Sunrise</span>
                                    <span class="detail-value">${day.sunrise}</span>
                                </div>` : ''}
                                
                                ${day.sunset !== undefined ? `
                                <div class="detail-row">
                                    <span class="detail-label">🌇 Sunset</span>
                                    <span class="detail-value">${day.sunset}</span>
                                </div>` : ''}
                                
                                ${day.uvi !== undefined ? `
                                <div class="detail-row">
                                    <span class="detail-label">☀️ UV Index</span>
                                    <span class="detail-value">${day.uvi}</span>
                                </div>` : ''}
                                
                                ${day.pressure !== undefined ? `
                                <div class="detail-row">
                                    <span class="detail-label">🌡️ Pressure</span>
                                    <span class="detail-value">${day.pressure} hPa</span>
                                </div>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Expose for debugging
        window.loadForecast = loadForecast;
    </script>
</body>
</html>
